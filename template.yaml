AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Kashia WhatsApp Bot - Build 20260913050654

Globals:
  Function:
    Timeout: 30
    Runtime: python3.12
    MemorySize: 512
    Environment:
      Variables:
        TABLE_PREFIX: kashia
        AWS_REGION_NAME: !Ref AWS::Region
        GENERATED_FILES_BUCKET: !Ref GeneratedFilesBucket

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

Resources:

  # ============================================
  # API GATEWAY
  # ============================================
  WebhookApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Stage
      Description: Kashia WhatsApp Bot - Build 20260913050654

  # ============================================
  # LAMBDA FUNCTIONS
  # ============================================
  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub kashia-webhook-${Stage}
      Handler: handlers/webhook.lambda_handler
      CodeUri: src/
      Layers:
        - !Ref DependenciesLayer
      Description: Kashia WhatsApp Bot - Build 20260913050654
      Events:
        WebhookPost:
          Type: Api
          Properties:
            RestApiId: !Ref WebhookApi
            Path: /webhook
            Method: post
        WebhookGet:
          Type: Api
          Properties:
            RestApiId: !Ref WebhookApi
            Path: /webhook
            Method: get
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TransactionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationStateTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MLFeedbackTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MerchantMemoryTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ContactsTable
        - S3CrudPolicy:
            BucketName: !Ref GeneratedFilesBucket
        - SSMParameterReadPolicy:
            ParameterName: "kashia/*"

  ScheduledReportsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub kashia-scheduled-reports-${Stage}
      Handler: handlers/scheduled_reports.lambda_handler
      CodeUri: src/
      Layers:
        - !Ref DependenciesLayer
      Description: Kashia WhatsApp Bot - Build 20260913050654
      Timeout: 300
      # Async (EventBridge Schedule) invocation failures land here after Lambda's
      # built-in retries, so a failed daily/weekly report is not silently lost.
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt ScheduledReportsDLQ.Arn
      Events:
        DailyReport:
          Type: Schedule
          Properties:
            Schedule: cron(0 19 * * ? *)
            Description: Kashia WhatsApp Bot - Build 20260913050654
            Enabled: true
        WeeklyReport:
          Type: Schedule
          Properties:
            Schedule: cron(0 17 ? * SUN *)
            Description: Kashia WhatsApp Bot - Build 20260913050654
            Enabled: true
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TransactionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ContactsTable
        - S3CrudPolicy:
            BucketName: !Ref GeneratedFilesBucket
        - SSMParameterReadPolicy:
            ParameterName: "kashia/*"
        # Allow the function to write failed async invocations to its DLQ
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ScheduledReportsDLQ.QueueName

  # Monthly Counter Reset (zeroes exports/invoices counters on the 1st)
  MonthlyResetFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub kashia-monthly-reset-${Stage}
      Handler: handlers/monthly_reset.lambda_handler
      CodeUri: src/
      Layers:
        - !Ref DependenciesLayer
      Description: Resets monthly usage counters for all users
      Timeout: 300
      # Async (EventBridge) failures land in a DLQ so a missed reset is visible.
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt ScheduledReportsDLQ.Arn
      Events:
        MonthlyReset:
          Type: Schedule
          Properties:
            # 00:05 UTC on the 1st of every month
            Schedule: cron(5 0 1 * ? *)
            Description: Reset monthly usage counters
            Enabled: true
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - SSMParameterReadPolicy:
            ParameterName: "kashia/*"
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ScheduledReportsDLQ.QueueName

  # Retention Purge (N1) — TRUE-deletes archived rows past retain_until.
  # RETENTION_DAYS (services/database.py) is now confirmed at 6 years (Nigeria
  # FIRS/tax minimum), so real deletion is ENABLED (PURGE_DRY_RUN=false). Note:
  # nothing is deleted until an archived row's retain_until (archive date + 6y)
  # has actually passed, so effect is nil for years; the job logs every delete.
  RetentionPurgeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub kashia-retention-purge-${Stage}
      Handler: handlers/retention_purge.lambda_handler
      CodeUri: src/
      Layers:
        - !Ref DependenciesLayer
      Description: Purges archived records past their retention window (dry-run by default)
      Timeout: 300
      Environment:
        Variables:
          # "false" = real deletion of rows whose retain_until has passed.
          # Enabled after RETENTION_DAYS was confirmed at 6 years (Nigeria
          # FIRS/tax). Set back to "true" to return to count-only dry-run.
          PURGE_DRY_RUN: "false"
          STAGE: !Ref Stage
      # Async (EventBridge) failures land in a DLQ so a missed purge is visible.
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt ScheduledReportsDLQ.Arn
      Events:
        MonthlyPurge:
          Type: Schedule
          Properties:
            # 00:30 UTC on the 1st of every month (after the monthly reset).
            Schedule: cron(30 0 1 * ? *)
            Description: Retention purge of expired archived records
            Enabled: true
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TransactionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ContactsTable
        - SSMParameterReadPolicy:
            ParameterName: "kashia/*"
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ScheduledReportsDLQ.QueueName

  # Subscription Reminder + Auto-Downgrade (S2) — daily. Sends T-7/T-3/T-1
  # renewal nudges, a 3-day-grace "payment overdue" nudge, and auto-downgrades
  # lapsed paid users to Free (keeps all data). Grandfathered paid users (no
  # subscription_ends) are skipped. Delivery reuses the cross-platform client
  # resolver (SSM holds the WhatsApp/Telegram tokens).
  SubscriptionReminderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub kashia-subscription-reminder-${Stage}
      Handler: handlers/subscription_reminder.lambda_handler
      CodeUri: src/
      Layers:
        - !Ref DependenciesLayer
      Description: Renewal/expiry alerts + auto-downgrade for lapsed subscriptions
      Timeout: 300
      # Async (EventBridge) failures land in the shared DLQ so a missed run shows.
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt ScheduledReportsDLQ.Arn
      Events:
        DailySubscriptionCheck:
          Type: Schedule
          Properties:
            # 08:00 UTC daily (09:00 WAT) — morning nudge.
            Schedule: cron(0 8 * * ? *)
            Description: Daily subscription renewal/expiry check
            Enabled: true
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - SSMParameterReadPolicy:
            ParameterName: "kashia/*"
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ScheduledReportsDLQ.QueueName

  # Paystack Webhook (payment confirmations)
  PaystackWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub kashia-paystack-webhook-${Stage}
      Handler: handlers/paystack_webhook.lambda_handler
      CodeUri: src/
      Layers:
        - !Ref DependenciesLayer
      Description: Kashia Paystack Payment Webhook
      Timeout: 30
      Events:
        PaystackPost:
          Type: Api
          Properties:
            RestApiId: !Ref WebhookApi
            Path: /paystack
            Method: post
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - SSMParameterReadPolicy:
            ParameterName: "kashia/*"

  # Telegram Webhook (incoming Telegram updates) — independent bot, same engine
  TelegramWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub kashia-telegram-webhook-${Stage}
      Handler: handlers/telegram_webhook.lambda_handler
      CodeUri: src/
      Layers:
        - !Ref DependenciesLayer
      Description: Kashia Telegram Bot webhook — shares the KashiaBot engine
      Environment:
        Variables:
          # Lets the webhook's secret-token check fail closed in prod.
          STAGE: !Ref Stage
          # NOTE: MINIAPP_URL is intentionally NOT set here. Referencing
          # !Ref WebhookApi from a function that is ALSO attached to WebhookApi
          # creates a CloudFormation circular dependency (deploy fails). The
          # Mini App's primary entry point is the bot Menu Button, configured
          # post-deploy by set_telegram_menu_button.sh (reads the MiniAppUrl
          # stack output — no cycle). The dashboard-card "Open full app" button
          # renders only when MINIAPP_URL is present, so it stays hidden until we
          # wire it via a cycle-free mechanism (a config value / SSM param set
          # after first deploy).
      Events:
        # Telegram only POSTs updates (no GET verification handshake; the
        # webhook is registered out-of-band via the Bot API setWebhook method).
        TelegramPost:
          Type: Api
          Properties:
            RestApiId: !Ref WebhookApi
            Path: /telegram
            Method: post
      Policies:
        # Same data access as the WhatsApp webhook — it runs the same engine.
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TransactionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationStateTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MLFeedbackTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MerchantMemoryTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ContactsTable
        - S3CrudPolicy:
            BucketName: !Ref GeneratedFilesBucket
        - SSMParameterReadPolicy:
            ParameterName: "kashia/*"

  # Telegram Mini App (N6, M2) — read-only JSON API for the in-chat web view.
  # Authenticated per request via Telegram WebApp initData (HMAC). Reuses the
  # shared accounting engine + catalog, so web numbers match the chat dashboard.
  # READ-ONLY: least-privilege DynamoDB read policies (v1 shows data only).
  MiniAppFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub kashia-miniapp-${Stage}
      Handler: handlers/miniapp.lambda_handler
      CodeUri: src/
      Layers:
        - !Ref DependenciesLayer
      Description: Kashia Telegram Mini App — read-only dashboard/inventory API
      Environment:
        Variables:
          STAGE: !Ref Stage
      Events:
        AppPageGet:
          Type: Api
          Properties:
            RestApiId: !Ref WebhookApi
            Path: /app
            Method: get
        SummaryGet:
          Type: Api
          Properties:
            RestApiId: !Ref WebhookApi
            Path: /app/api/summary
            Method: get
        InventoryGet:
          Type: Api
          Properties:
            RestApiId: !Ref WebhookApi
            Path: /app/api/inventory
            Method: get
        ChartsGet:
          Type: Api
          Properties:
            RestApiId: !Ref WebhookApi
            Path: /app/api/charts
            Method: get
        TreeGet:
          Type: Api
          Properties:
            RestApiId: !Ref WebhookApi
            Path: /app/api/tree
            Method: get
        ProductWrite:
          Type: Api
          Properties:
            RestApiId: !Ref WebhookApi
            Path: /app/api/product
            Method: post
        TransactionWrite:
          Type: Api
          Properties:
            RestApiId: !Ref WebhookApi
            Path: /app/api/transaction
            Method: post
        ContactsGet:
          Type: Api
          Properties:
            RestApiId: !Ref WebhookApi
            Path: /app/api/contacts
            Method: get
        DebtPaymentWrite:
          Type: Api
          Properties:
            RestApiId: !Ref WebhookApi
            Path: /app/api/debt-payment
            Method: post
        RecordsGet:
          Type: Api
          Properties:
            RestApiId: !Ref WebhookApi
            Path: /app/api/records
            Method: get
        ExportGet:
          Type: Api
          Properties:
            RestApiId: !Ref WebhookApi
            Path: /app/api/export
            Method: get
      Policies:
        # UsersTable needs WRITE (M6a): the product catalog lives on the user
        # record, so catalog edits (stock/price/cost) update it.
        # M6b (web transaction entry) WRITES transactions (save + idempotency
        # marker + cost stamp) and contacts (CRM totals / debt), so both tables
        # need CRUD — a read-only policy here was the "could not record" bug.
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TransactionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ContactsTable
        # Records-tab export builds a file + uploads to S3 for chat delivery
        # (was AccessDenied → "sent to chat" but nothing arrived).
        - S3CrudPolicy:
            BucketName: !Ref GeneratedFilesBucket
        - SSMParameterReadPolicy:
            ParameterName: "kashia/*"

  # ============================================
  # DYNAMODB TABLES
  # ============================================

  # Table 1: Users
  UsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub kashia-users-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: phone_number
          AttributeType: S
      KeySchema:
        - AttributeName: phone_number
          KeyType: HASH

  # Table 2: Transactions
  TransactionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub kashia-transactions-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: phone_number
          AttributeType: S
        - AttributeName: transaction_id
          AttributeType: S
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: phone_number
          KeyType: HASH
        - AttributeName: transaction_id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: date-index
          KeySchema:
            - AttributeName: phone_number
              KeyType: HASH
            - AttributeName: date
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # Table 3: Conversation State
  ConversationStateTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub kashia-conversation-state-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: phone_number
          AttributeType: S
      KeySchema:
        - AttributeName: phone_number
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # Table 4: ML Feedback (corrections for AI learning)
  MLFeedbackTable:
    DeletionPolicy: Retain
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub kashia-ml-feedback-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: phone_number
          AttributeType: S
        - AttributeName: feedback_id
          AttributeType: S
      KeySchema:
        - AttributeName: phone_number
          KeyType: HASH
        - AttributeName: feedback_id
          KeyType: RANGE

  # Table 5: Merchant Memory (vendor → category cache)
  MerchantMemoryTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub kashia-merchant-memory-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: phone_number
          AttributeType: S
        - AttributeName: vendor_normalized
          AttributeType: S
      KeySchema:
        - AttributeName: phone_number
          KeyType: HASH
        - AttributeName: vendor_normalized
          KeyType: RANGE

  # Table 6: Contacts (CRM)
  ContactsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub kashia-contacts-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: phone_number
          AttributeType: S
        - AttributeName: contact_id
          AttributeType: S
      KeySchema:
        - AttributeName: phone_number
          KeyType: HASH
        - AttributeName: contact_id
          KeyType: RANGE

  # ============================================
  # S3 BUCKET (generated files — auto-delete after 1 day)
  # ============================================
  GeneratedFilesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub kashia-generated-files-${Stage}-${AWS::AccountId}
      LifecycleConfiguration:
        Rules:
          - Id: DeleteTempFilesAfter1Day
            Status: Enabled
            Prefix: "exports/"
            ExpirationInDays: 1
          - Id: DeleteDocsAfter7Days
            Status: Enabled
            Prefix: "documents/"
            ExpirationInDays: 7

  # ============================================
  # DEAD-LETTER QUEUE (failed async report invocations)
  # ============================================
  ScheduledReportsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub kashia-scheduled-reports-dlq-${Stage}
      MessageRetentionPeriod: 1209600  # 14 days (max) — time to inspect failures

  # ============================================
  # CLOUDWATCH ALARMS (webhook health)
  # ============================================
  WebhookErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub kashia-webhook-errors-${Stage}
      AlarmDescription: Webhook Lambda is throwing errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref WebhookFunction
      Statistic: Sum
      Period: 300           # 5-minute windows
      EvaluationPeriods: 1
      Threshold: 5          # >5 errors in 5 min
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  WebhookThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub kashia-webhook-throttles-${Stage}
      AlarmDescription: Webhook Lambda is being throttled
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref WebhookFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1          # any throttling is worth knowing about
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  TelegramWebhookErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub kashia-telegram-webhook-errors-${Stage}
      AlarmDescription: Telegram webhook Lambda is throwing errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref TelegramWebhookFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  TelegramWebhookThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub kashia-telegram-webhook-throttles-${Stage}
      AlarmDescription: Telegram webhook Lambda is being throttled
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref TelegramWebhookFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  ScheduledReportsDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub kashia-scheduled-reports-dlq-not-empty-${Stage}
      AlarmDescription: A scheduled report failed and landed in the DLQ
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ScheduledReportsDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0          # >0 messages = something failed
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # ============================================
  # LAMBDA LAYER (extra Python packages)
  # ============================================
  DependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub kashia-dependencies-${Stage}
      Description: Kashia WhatsApp Bot - Build 20260913050654
      ContentUri: layers/dependencies/layer.zip
      CompatibleRuntimes:
        - python3.12

# ============================================
# OUTPUTS (shows you the important URLs after deploy)
# ============================================
Outputs:
  WebhookUrl:
    Description: Kashia WhatsApp Bot - Build 20260913050654
    Value: !Sub "https://${WebhookApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/webhook"
  MiniAppUrl:
    Description: Telegram Mini App page URL (set as the bot Menu Button web_app url)
    Value: !Sub "https://${WebhookApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/app"
  PaystackWebhookUrl:
    Description: Register this URL in the Paystack dashboard (Settings → Webhooks)
    Value: !Sub "https://${WebhookApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/paystack"
  TelegramWebhookUrl:
    Description: Point Telegram setWebhook at this URL
    Value: !Sub "https://${WebhookApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/telegram"
  WebhookFunctionArn:
    Description: Kashia WhatsApp Bot - Build 20260913050654
    Value: !GetAtt WebhookFunction.Arn
  ScheduledReportsFunctionArn:
    Description: Kashia WhatsApp Bot - Build 20260913050654
    Value: !GetAtt ScheduledReportsFunction.Arn
