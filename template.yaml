AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Kashia WhatsApp Bot - Build 20260906151040

Globals:
  Function:
    Timeout: 30
    Runtime: python3.12
    MemorySize: 512
    Environment:
      Variables:
        TABLE_PREFIX: kashia
        AWS_REGION_NAME: !Ref AWS::Region
        GENERATED_FILES_BUCKET: !Ref GeneratedFilesBucket

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

Resources:

  # ============================================
  # API GATEWAY
  # ============================================
  WebhookApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Stage
      Description: Kashia WhatsApp Bot - Build 20260906151040

  # ============================================
  # LAMBDA FUNCTIONS
  # ============================================
  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub kashia-webhook-${Stage}
      Handler: handlers/webhook.lambda_handler
      CodeUri: src/
      Layers:
        - !Ref DependenciesLayer
      Description: Kashia WhatsApp Bot - Build 20260906151040
      Events:
        WebhookPost:
          Type: Api
          Properties:
            RestApiId: !Ref WebhookApi
            Path: /webhook
            Method: post
        WebhookGet:
          Type: Api
          Properties:
            RestApiId: !Ref WebhookApi
            Path: /webhook
            Method: get
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TransactionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationStateTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MLFeedbackTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MerchantMemoryTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ContactsTable
        - S3CrudPolicy:
            BucketName: !Ref GeneratedFilesBucket
        - SSMParameterReadPolicy:
            ParameterName: "kashia/*"

  ScheduledReportsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub kashia-scheduled-reports-${Stage}
      Handler: handlers/scheduled_reports.lambda_handler
      CodeUri: src/
      Layers:
        - !Ref DependenciesLayer
      Description: Kashia WhatsApp Bot - Build 20260906151040
      Timeout: 300
      # Async (EventBridge Schedule) invocation failures land here after Lambda's
      # built-in retries, so a failed daily/weekly report is not silently lost.
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt ScheduledReportsDLQ.Arn
      Events:
        DailyReport:
          Type: Schedule
          Properties:
            Schedule: cron(0 19 * * ? *)
            Description: Kashia WhatsApp Bot - Build 20260906151040
            Enabled: true
        WeeklyReport:
          Type: Schedule
          Properties:
            Schedule: cron(0 17 ? * SUN *)
            Description: Kashia WhatsApp Bot - Build 20260906151040
            Enabled: true
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TransactionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ContactsTable
        - S3CrudPolicy:
            BucketName: !Ref GeneratedFilesBucket
        - SSMParameterReadPolicy:
            ParameterName: "kashia/*"
        # Allow the function to write failed async invocations to its DLQ
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ScheduledReportsDLQ.QueueName

  # Monthly Counter Reset (zeroes exports/invoices counters on the 1st)
  MonthlyResetFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub kashia-monthly-reset-${Stage}
      Handler: handlers/monthly_reset.lambda_handler
      CodeUri: src/
      Layers:
        - !Ref DependenciesLayer
      Description: Resets monthly usage counters for all users
      Timeout: 300
      # Async (EventBridge) failures land in a DLQ so a missed reset is visible.
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt ScheduledReportsDLQ.Arn
      Events:
        MonthlyReset:
          Type: Schedule
          Properties:
            # 00:05 UTC on the 1st of every month
            Schedule: cron(5 0 1 * ? *)
            Description: Reset monthly usage counters
            Enabled: true
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - SSMParameterReadPolicy:
            ParameterName: "kashia/*"
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ScheduledReportsDLQ.QueueName

  # Paystack Webhook (payment confirmations)
  PaystackWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub kashia-paystack-webhook-${Stage}
      Handler: handlers/paystack_webhook.lambda_handler
      CodeUri: src/
      Layers:
        - !Ref DependenciesLayer
      Description: Kashia Paystack Payment Webhook
      Timeout: 30
      Events:
        PaystackPost:
          Type: Api
          Properties:
            RestApiId: !Ref WebhookApi
            Path: /paystack
            Method: post
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - SSMParameterReadPolicy:
            ParameterName: "kashia/*"

  # Telegram Webhook (incoming Telegram updates) — independent bot, same engine
  TelegramWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub kashia-telegram-webhook-${Stage}
      Handler: handlers/telegram_webhook.lambda_handler
      CodeUri: src/
      Layers:
        - !Ref DependenciesLayer
      Description: Kashia Telegram Bot webhook — shares the KashiaBot engine
      Environment:
        Variables:
          # Lets the webhook's secret-token check fail closed in prod.
          STAGE: !Ref Stage
      Events:
        # Telegram only POSTs updates (no GET verification handshake; the
        # webhook is registered out-of-band via the Bot API setWebhook method).
        TelegramPost:
          Type: Api
          Properties:
            RestApiId: !Ref WebhookApi
            Path: /telegram
            Method: post
      Policies:
        # Same data access as the WhatsApp webhook — it runs the same engine.
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TransactionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationStateTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MLFeedbackTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MerchantMemoryTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ContactsTable
        - S3CrudPolicy:
            BucketName: !Ref GeneratedFilesBucket
        - SSMParameterReadPolicy:
            ParameterName: "kashia/*"

  # ============================================
  # DYNAMODB TABLES
  # ============================================

  # Table 1: Users
  UsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub kashia-users-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: phone_number
          AttributeType: S
      KeySchema:
        - AttributeName: phone_number
          KeyType: HASH

  # Table 2: Transactions
  TransactionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub kashia-transactions-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: phone_number
          AttributeType: S
        - AttributeName: transaction_id
          AttributeType: S
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: phone_number
          KeyType: HASH
        - AttributeName: transaction_id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: date-index
          KeySchema:
            - AttributeName: phone_number
              KeyType: HASH
            - AttributeName: date
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # Table 3: Conversation State
  ConversationStateTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub kashia-conversation-state-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: phone_number
          AttributeType: S
      KeySchema:
        - AttributeName: phone_number
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # Table 4: ML Feedback (corrections for AI learning)
  MLFeedbackTable:
    DeletionPolicy: Retain
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub kashia-ml-feedback-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: phone_number
          AttributeType: S
        - AttributeName: feedback_id
          AttributeType: S
      KeySchema:
        - AttributeName: phone_number
          KeyType: HASH
        - AttributeName: feedback_id
          KeyType: RANGE

  # Table 5: Merchant Memory (vendor → category cache)
  MerchantMemoryTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub kashia-merchant-memory-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: phone_number
          AttributeType: S
        - AttributeName: vendor_normalized
          AttributeType: S
      KeySchema:
        - AttributeName: phone_number
          KeyType: HASH
        - AttributeName: vendor_normalized
          KeyType: RANGE

  # Table 6: Contacts (CRM)
  ContactsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub kashia-contacts-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: phone_number
          AttributeType: S
        - AttributeName: contact_id
          AttributeType: S
      KeySchema:
        - AttributeName: phone_number
          KeyType: HASH
        - AttributeName: contact_id
          KeyType: RANGE

  # ============================================
  # S3 BUCKET (generated files — auto-delete after 1 day)
  # ============================================
  GeneratedFilesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub kashia-generated-files-${Stage}-${AWS::AccountId}
      LifecycleConfiguration:
        Rules:
          - Id: DeleteTempFilesAfter1Day
            Status: Enabled
            Prefix: "exports/"
            ExpirationInDays: 1
          - Id: DeleteDocsAfter7Days
            Status: Enabled
            Prefix: "documents/"
            ExpirationInDays: 7

  # ============================================
  # DEAD-LETTER QUEUE (failed async report invocations)
  # ============================================
  ScheduledReportsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub kashia-scheduled-reports-dlq-${Stage}
      MessageRetentionPeriod: 1209600  # 14 days (max) — time to inspect failures

  # ============================================
  # CLOUDWATCH ALARMS (webhook health)
  # ============================================
  WebhookErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub kashia-webhook-errors-${Stage}
      AlarmDescription: Webhook Lambda is throwing errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref WebhookFunction
      Statistic: Sum
      Period: 300           # 5-minute windows
      EvaluationPeriods: 1
      Threshold: 5          # >5 errors in 5 min
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  WebhookThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub kashia-webhook-throttles-${Stage}
      AlarmDescription: Webhook Lambda is being throttled
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref WebhookFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1          # any throttling is worth knowing about
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  TelegramWebhookErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub kashia-telegram-webhook-errors-${Stage}
      AlarmDescription: Telegram webhook Lambda is throwing errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref TelegramWebhookFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  TelegramWebhookThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub kashia-telegram-webhook-throttles-${Stage}
      AlarmDescription: Telegram webhook Lambda is being throttled
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref TelegramWebhookFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  ScheduledReportsDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub kashia-scheduled-reports-dlq-not-empty-${Stage}
      AlarmDescription: A scheduled report failed and landed in the DLQ
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ScheduledReportsDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0          # >0 messages = something failed
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # ============================================
  # LAMBDA LAYER (extra Python packages)
  # ============================================
  DependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub kashia-dependencies-${Stage}
      Description: Kashia WhatsApp Bot - Build 20260906151040
      ContentUri: layers/dependencies/layer.zip
      CompatibleRuntimes:
        - python3.12

# ============================================
# OUTPUTS (shows you the important URLs after deploy)
# ============================================
Outputs:
  WebhookUrl:
    Description: Kashia WhatsApp Bot - Build 20260906151040
    Value: !Sub "https://${WebhookApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/webhook"
  TelegramWebhookUrl:
    Description: Point Telegram setWebhook at this URL
    Value: !Sub "https://${WebhookApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/telegram"
  WebhookFunctionArn:
    Description: Kashia WhatsApp Bot - Build 20260906151040
    Value: !GetAtt WebhookFunction.Arn
  ScheduledReportsFunctionArn:
    Description: Kashia WhatsApp Bot - Build 20260906151040
    Value: !GetAtt ScheduledReportsFunction.Arn
